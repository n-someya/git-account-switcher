[package]
name = "git-account-switcher"
version = "0.1.0"
edition = "2021"
description = "Declarative Git & GitHub CLI multi-account manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n-someya/git-account-switcher"
readme = "README.md"
keywords = ["git", "github", "account", "cli", "multi-account"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
anstream = "1.0"
anstyle = "1.0"

[dev-dependencies]
insta = { version = "1.42", features = ["yaml"] }
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
